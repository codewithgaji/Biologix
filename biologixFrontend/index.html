<!doctype html>
<html lang="en">
  <head>
    <script>
      const theme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (theme === 'dark' || (!theme && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="application-name" content="BioLogix" />

    <meta property="og:title" content="BioLogix - Biometric Attendance System" />
    <meta property="og:description" content="Biometric attendance management system for tracking employee attendance and generating reports." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />

    <link rel="shortcut icon" href="/favicon.svg" />
  </head>
